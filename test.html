<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gemma 3 27B API</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --text-color: #cdd6f4;
            --input-bg: #313244;
            --accent: #89b4fa;
            --success: #a6e3a1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h2 {
            color: var(--accent);
            border-bottom: 2px solid var(--input-bg);
            padding-bottom: 10px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 5px;
            display: block;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #45475a;
            background-color: var(--input-bg);
            color: #fff;
            font-family: inherit;
            box-sizing: border-box;
            /* Fix lỗi tràn viền */
        }

        input:focus,
        textarea:focus {
            outline: 2px solid var(--accent);
            border-color: transparent;
        }

        button {
            background-color: var(--accent);
            color: #111;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1em;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background-color: #585b70;
            cursor: not-allowed;
        }

        #response-area {
            margin-top: 20px;
            padding: 20px;
            background-color: #181825;
            border-radius: 8px;
            border: 1px solid #45475a;
            min-height: 100px;
        }

        /* Style cho code block trong câu trả lời */
        pre {
            background: #11111b;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            color: var(--success);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <h2>🛠️ Gemma API Tester</h2>

    <div class="container">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label>API Key (Google AI Studio):</label>
                <input type="password" id="apiKey" placeholder="Dán API Key vào đây...">
            </div>
            <div>
                <label>Model Name:</label>
                <input type="text" id="modelName" value="gemma-3-27b-it" placeholder="Ví dụ: gemma-3-27b-it">
            </div>
        </div>

        <div>
            <label>System Instruction (Vai trò):</label>
            <textarea id="systemPrompt" rows="2"
                placeholder="Ví dụ: Bạn là nhân viên CSKH thân thiện...">Bạn là một trợ lý AI hữu ích, trả lời ngắn gọn và đúng trọng tâm bằng Tiếng Việt.</textarea>
        </div>

        <div>
            <label>User Prompt (Câu hỏi):</label>
            <textarea id="userPrompt" rows="4" placeholder="Nhập câu hỏi của bạn..."></textarea>
        </div>

        <button id="sendBtn" onclick="callGemma()">🚀 Gửi yêu cầu</button>

        <div id="loading" class="hidden">⏳ Đang suy nghĩ...</div>
        <div id="response-area">Kết quả sẽ hiện ở đây...</div>
    </div>

    <script>
        async function callGemma() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelName = document.getElementById('modelName').value.trim();
            const systemPrompt = document.getElementById('systemPrompt').value.trim();
            const userPrompt = document.getElementById('userPrompt').value.trim();

            const responseDiv = document.getElementById('response-area');
            const loadingDiv = document.getElementById('loading');
            const btn = document.getElementById('sendBtn');

            if (!apiKey) {
                alert("Vui lòng nhập API Key!");
                return;
            }

            // UI Loading state
            btn.disabled = true;
            loadingDiv.classList.remove('hidden');
            responseDiv.innerHTML = "";

            // URL API
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

            // --- KHẮC PHỤC LỖI ---
            // Vì Gemma không hỗ trợ 'systemInstruction' riêng, ta gộp nó vào message của user
            let finalPrompt = userPrompt;
            if (systemPrompt) {
                finalPrompt = `**System Instruction:**\n${systemPrompt}\n\n**User Request:**\n${userPrompt}`;
            }

            const data = {
                contents: [
                    {
                        role: "user",
                        parts: [{ text: finalPrompt }]
                    }
                ],
                // Bỏ trường systemInstruction đi để tránh lỗi
                generationConfig: {
                    temperature: 0.7,
                    maxOutputTokens: 2048,
                }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const json = await response.json();

                if (!response.ok) {
                    // In lỗi chi tiết ra để debug
                    throw new Error(json.error?.message || "Lỗi không xác định từ API");
                }

                if (json.candidates && json.candidates[0].content) {
                    const rawText = json.candidates[0].content.parts[0].text;
                    responseDiv.innerHTML = marked.parse(rawText);
                } else {
                    responseDiv.innerHTML = "Model không trả về nội dung (Có thể do bộ lọc Safety chặn).";
                }

            } catch (error) {
                responseDiv.innerHTML = `<span style="color: #ff5555;">❌ Lỗi: ${error.message}</span>`;
                console.error(error);
            } finally {
                btn.disabled = false;
                loadingDiv.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
